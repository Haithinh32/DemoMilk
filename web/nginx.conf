server {
    listen 80;
    root /usr/share/nginx/html;

    # /api/* -> server FastAPI (bỏ tiền tố /api)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;   # NC1/NC2 huấn luyện mô hình mất vài giây
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Ứng dụng một trang: mọi đường dẫn khác trả index.html
    location / {
        try_files $uri /index.html;
    }
}
